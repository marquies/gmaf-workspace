[tools]
java = "21"
maven = "latest"
node = "lts"
python = "3.11"    # used by scripts/pom-graph.py

[tasks.list]
description = "List all GMAF repositories in the manifest and their clone status"
run = "bash scripts/list-repos.sh"

[tasks.clone]
description = "Clone every GMAF repository into ./repos (skips repos already cloned)"
run = "bash scripts/clone-all.sh"

[tasks.pull]
description = "Git pull --ff-only in every cloned repository"
run = "bash scripts/foreach.sh git pull --ff-only"

[tasks.status]
description = "Show git status -sb for every cloned repository"
run = "bash scripts/foreach.sh git status -sb"

[tasks.setup]
description = "Clone (if needed) and bootstrap every repo for local development"
depends = ["clone"]
run = "bash scripts/setup-all.sh"

[tasks.build-order]
description = "Show the pom.xml-derived build order without building anything"
run = "python3 scripts/pom-graph.py --format=human"

[tasks.build]
description = "Build every cloned repo in pom.xml dependency order (mvn install, npm build, cmake)"
run = "bash scripts/build-all.sh"

[tasks.idea]
description = "Generate an IntelliJ IDEA project linking every cloned repo (Maven modules, Git roots, run configs)"
run = "python3 scripts/idea-project.py"

[tasks.dev]
description = "Run the dev environment: GMAF-UI (hosts the REST API) + the React web UI prototype; --basedir picks the conf folder"
run = "bash scripts/dev.sh"

[tasks.clean]
description = "Delete the checkouts in ./repos (refuses if a repo holds unsaved work)"
run = "bash scripts/clean-all.sh"

[tasks.reset]
description = "Delete every checkout and clone it again from scratch"
depends = ["clean"]
run = "bash scripts/clone-all.sh"

[tasks.exec]
description = "Run an arbitrary command in every cloned repo, e.g. `mise run exec -- git log -1`"
run = "bash scripts/foreach.sh"
